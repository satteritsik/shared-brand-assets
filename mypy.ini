[mypy]
strict = True
plugins = pydantic.mypy
disallow_any_explicit = True
disallow_any_unimported = True
disallow_any_decorated = True
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR/src, $MYPY_CONFIG_FILE_DIR/cdk, $MYPY_CONFIG_FILE_DIR/ops
exclude = (^|/)(\.code-checks|cdk\.out|\.venv|node_modules|build|dist)/

# Typed, extra-forbidding __init__ for each model, so a pydantic model carries no explicit Any.
[pydantic-mypy]
init_forbid_extra = True
init_typed = True
